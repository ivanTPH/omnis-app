name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Only run these spec files (space-separated, e.g. e2e/tests/send-smoke.spec.ts). Empty = full suite.'
        required: false
        default: ''
      skip_deploy_wait:
        description: 'Skip waiting for a new deploy (the live site is already on this commit).'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      deployment_uuid: ${{ steps.trigger.outputs.deployment_uuid || '' }}

    steps:
      # No deploy trigger here: Coolify already deploys on every push (webhook).
      # Triggering a second deploy started two builds at once, and the webhook
      # build regularly failed. This job now only waits for the new container.
      - name: Note
        run: echo "Coolify deploys via its own webhook; waiting for the new container."

      - name: Wait for new container + warm all auth paths
        if: ${{ !inputs.skip_deploy_wait }}
        # Builds take 6-20 min, so a fixed sleep is unreliable (on 23 Oct the
        # suite ran against the OLD container because the build took 16 min).
        # /api/health reports the commit it was built from: wait until it
        # matches this run's commit. Containers built before that field existed
        # report nothing; if the new build reports "local" (no commit build arg
        # supplied), fall back to a generous fixed wait.
        run: |
          BASE=https://omnis.education
          WANT="${GITHUB_SHA}"
          echo "Waiting for ${BASE}/api/health to report commit ${WANT} …"
          LIVE=false
          for i in $(seq 1 90); do
            GOT=$(curl -sf --max-time 15 "$BASE/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            echo "$(date -u '+%H:%M:%S') UTC — live commit: ${GOT:-unknown}"
            if [ "$GOT" = "$WANT" ]; then LIVE=true; break; fi
            if [ "$GOT" = "local" ]; then
              echo "Build does not report its commit — falling back to a 20-minute wait"
              sleep 1200; LIVE=true; break
            fi
            sleep 30
          done
          if [ "$LIVE" != "true" ]; then
            echo "::error::omnis.education never reported commit ${WANT} within 45 minutes — check the Coolify deployment"
            exit 1
          fi

          echo "Polling auth endpoint until new container is ready …"
          READY=false
          for i in $(seq 1 24); do
            CSRF=$(curl -sf --max-time 20 "$BASE/api/auth/csrf" \
              | sed 's/.*"csrfToken":"\([^"]*\)".*/\1/' || true)
            if [ -z "$CSRF" ]; then
              echo "$(date -u '+%H:%M:%S') UTC — no CSRF yet, waiting 30s …"
              sleep 30
              continue
            fi
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
              -X POST "$BASE/api/auth/callback/credentials" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "csrfToken=${CSRF}&email=j.patel%40omnisdemo.school&password=Demo1234%21&redirect=false" \
              --max-time 60 || echo "000")
            echo "$(date -u '+%H:%M:%S') UTC — auth HTTP $HTTP"
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "302" ]; then
              echo "New container ready — auth pipeline warm"
              READY=true
              break
            fi
            sleep 30
          done
          if [ "$READY" != "true" ]; then
            echo "Timed out waiting for auth endpoint" && exit 1
          fi

          echo "Warming /login SSR page …"
          curl -sf -o /dev/null --max-time 30 "$BASE/login" || true

          echo "Warming auth paths for all 9 roles …"
          EMAILS=(
            "c.roberts%40omnisdemo.school"
            "r.morris%40omnisdemo.school"
            "admin%40omnisdemo.school"
            "a.hughes%40students.omnisdemo.school"
            "t.adeyemi%40omnisdemo.school"
            "j.taylor%40omnisdemo.school"
            "d.brooks%40omnisdemo.school"
            "l.hughes%40parents.omnisdemo.school"
          )
          for EMAIL in "${EMAILS[@]}"; do
            CSRF=$(curl -sf --max-time 20 "$BASE/api/auth/csrf" \
              | sed 's/.*"csrfToken":"\([^"]*\)".*/\1/' || true)
            if [ -n "$CSRF" ]; then
              curl -sf -o /dev/null -w " → HTTP %{http_code}\n" \
                -X POST "$BASE/api/auth/callback/credentials" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "csrfToken=${CSRF}&email=${EMAIL}&password=Demo1234%21&redirect=false" \
                --max-time 60 || true
              echo "Warmed: ${EMAIL}"
            fi
          done
          echo "All auth paths warmed — handing off to Playwright"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        # Passed via env, not interpolated into the script, so the input is
        # never parsed as shell code.
        run: npm run test:e2e -- $SPEC
        env:
          SPEC: ${{ inputs.spec }}
          PLAYWRIGHT_BASE_URL: https://omnis.education

      - name: Summarise failures as an annotation
        if: always()
        run: node scripts/e2e-annotate.mjs e2e-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

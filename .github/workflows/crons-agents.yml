name: Cron Jobs - Agents

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

env:
  BASE: https://omnis.education

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: skip-on-push
        if: github.event_name == 'push'
        run: echo "Push event -- nothing to do."
      - name: agent-coach
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: curl -sf "$BASE/api/cron/agent-coach" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

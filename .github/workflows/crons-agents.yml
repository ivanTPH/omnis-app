name: Cron Jobs - Agents

on:
  schedule:
    - cron: '0 2 * * 0'
    - cron: '0 5 * * 0'
    - cron: '0 6 * * 1-5'
    - cron: '30 2 * * *'
    - cron: '0 3 * * *'
    - cron: '30 3 * * *'
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE: https://omnis.education

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: skip-on-push
        if: github.event_name == 'push'
        run: echo "ok"
      - name: oak-sync
        if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
        run: echo "oak-sync"
      - name: agent-coach
        if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
        run: echo "agent-coach"

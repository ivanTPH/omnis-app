name: Cron Jobs - Agents

on:
  # Schedules now run inside the Omnis server (lib/scheduler/jobs.ts).
  # Only the DSPy job stays here because it needs Python.
  schedule:
    - cron: '30 2 * * 0'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    env:
      BASE: https://omnis.education
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: skip-on-push
        if: github.event_name == 'push'
        run: echo "Push event -- nothing to do."

      - name: wonde-sync
        # Nightly MIS sync. The route answers 202 and runs the sync in the
        # background; results are in WondeSyncLog (/admin/wonde) and Sentry.
        if: github.event.schedule == '15 1 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf --max-time 60 "$BASE/api/cron/wonde-sync" -H "Authorization: Bearer $CRON_SECRET"

      - name: oak-sync
        # The bulk sync takes ~45 min, so the route answers 202 and runs it in
        # the background; results are in OakSyncLog and Sentry.
        if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf --max-time 60 "$BASE/api/cron/oak-sync" -H "Authorization: Bearer $CRON_SECRET"

      - name: platform-insights
        if: github.event.schedule == '0 5 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf "$BASE/api/cron/platform-insights" -H "Authorization: Bearer $CRON_SECRET"

      - name: early-warning
        if: github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf "$BASE/api/cron/early-warning" -H "Authorization: Bearer $CRON_SECRET"

      - name: agent-coach
        if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          http_code=$(curl -s -o /tmp/agent-coach-resp.json -w "%{http_code}" "$BASE/api/cron/agent-coach" -H "Authorization: Bearer $CRON_SECRET")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "agent-coach failed with HTTP $http_code"
            echo "Response body:"
            cat /tmp/agent-coach-resp.json
            exit 1
          fi

      - name: agent-quality
        if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          http_code=$(curl -s -o /tmp/agent-quality-resp.json -w "%{http_code}" "$BASE/api/cron/agent-quality" -H "Authorization: Bearer $CRON_SECRET")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "agent-quality failed with HTTP $http_code"
            echo "Response body:"
            cat /tmp/agent-quality-resp.json
            exit 1
          fi

      - name: agent-plan-synthesis
        if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          http_code=$(curl -s -o /tmp/agent-plan-synthesis-resp.json -w "%{http_code}" "$BASE/api/cron/agent-plan-synthesis" -H "Authorization: Bearer $CRON_SECRET")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "agent-plan-synthesis failed with HTTP $http_code"
            echo "Response body:"
            cat /tmp/agent-plan-synthesis-resp.json
            exit 1
          fi

      - name: agent-engage
        if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          http_code=$(curl -s -o /tmp/agent-engage-resp.json -w "%{http_code}" "$BASE/api/cron/agent-engage" -H "Authorization: Bearer $CRON_SECRET")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "agent-engage failed with HTTP $http_code"
            echo "Response body:"
            cat /tmp/agent-engage-resp.json
            exit 1
          fi

      # DSPy weekly skill optimization -- runs 30 min after oak-sync (Sundays 02:30 UTC)
      # so CURRICULUM_ALIGNMENT judging happens against freshly-synced Oak content.
      - name: checkout-for-dspy
        if: github.event.schedule == '30 2 * * 0' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: setup-python-for-dspy
        if: github.event.schedule == '30 2 * * 0' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: dspy-weekly-optimize
        if: github.event.schedule == '30 2 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -r dspy-service/requirements.txt
          python dspy-service/weekly_run.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

name: Cron Jobs - Agents

on:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: skip-on-push
        if: github.event_name == 'push'
        run: echo "ok"
      - name: agent-coach
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "would run agent-coach"
